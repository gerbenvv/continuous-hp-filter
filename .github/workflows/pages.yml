name: Demo

# Publishes the interactive demo (javascript/index.html) on GitHub Pages.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   uses: actions/checkout@v4

            -   name: Assemble the site
                run: |
                    mkdir site
                    cp javascript/index.html javascript/demo.js javascript/style.css javascript/chp.js site/

            -   name: Check that every file the demo loads is in the site
                run: |
                    for file in $(grep -oE '(src|href)="[^":#]+"' site/index.html | sed -E 's/.*="([^"]+)"/\1/'); do
                        test -f "site/$file" || { echo "Missing: $file"; exit 1; }
                    done

            -   uses: actions/configure-pages@v5

            -   uses: actions/upload-pages-artifact@v3
                with:
                    path: site

            -   id: deployment
                uses: actions/deploy-pages@v4
